<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1024px;height:500px;overflow:hidden}
  body{
    font-family:'Noto Sans JP',sans-serif;
    background:linear-gradient(135deg,#FF6A1F,#FF1E88);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 64px;
  }
  .copy{display:flex;flex-direction:column;gap:18px;max-width:620px}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-name{font-weight:800;font-size:28px;color:#fff;letter-spacing:-.01em}
  .brand-sub{font-weight:700;font-size:12px;color:#16141F;letter-spacing:.3em}
  h1{font-weight:800;font-size:52px;line-height:1.3;color:#16141F;letter-spacing:-.02em;text-wrap:balance}
  .mark{width:260px;height:260px;flex:none}
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <span class="brand-name">ReadyGo</span>
      <span class="brand-sub">PHRASE</span>
    </div>
    <h1>知ってる単語なのに、<br>意味だけ、わからない。</h1>
  </div>
  <svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
        <rect width="128" height="128" fill="#000"/>
        <g transform="rotate(-5 64 64)">
          <path d="M22 22 C22 16 26 12 32 12 L44 12 L44 108 L22 108 Z" fill="#fff"/>
          <path d="M50 12 L64 12 C80 12 90 24 90 44 C90 64 80 76 64 76 L50 76 Z" fill="#fff"/>
          <path d="M66 31 L58 53 L74 53 Z" fill="#000"/>
          <rect x="96" y="80" width="14" height="14" rx="4" fill="#fff"/>
          <rect x="110" y="62" width="11" height="11" rx="3" fill="#fff"/>
        </g>
      </mask>
    </defs>
    <rect width="128" height="128" rx="30" fill="#16141F"/>
    <rect width="128" height="128" fill="#fff" mask="url(#m)"/>
  </svg>
</body>
</html>
